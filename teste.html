const reverseSprite = (sprite, width, height) => {
  const resArr = [];
  for (let y = 0; y < height; y++) {
    for (let x = (width * y) + width - 1; x > y * width - 1; x--) {
      resArr.push(sprite[x]);
    }
  }
  return resArr;
};

const draw = (contx, scene, width, height) => {
  contx.clearRect(0, 0, width * scale, height * scale);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const c = colors[scene[y * width + x]];
      if (c) ctx.fillStyle = c, ctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }
};

const drawChar = async () => {
  let count = 0;
  const selFrames = char.animations.idle;
  const animated = setInterval(() => {
    if (count == selFrames.length) count = 0;
    draw(ctx, char.frames.scenes.right[selFrames[count]], char.width, char.height);
    count++;
  }, 150);
  return;
};

const populateScenes = ({base, variations, scenes}, width) => {
  scenes.right.push(structuredClone(base));
  scenes.left.push(reverseSprite(base, char.width, char.height));
  let model = structuredClone(base);
  for (let i = 0; i < variations.length; i++) {
    for (let z = 0; z < variations[i].length; z++) {
      if (z == 0) {
        if (variations[i][z] === 1) model = structuredClone(base);
        continue;
      }
      model[variations[i][z][0] + (variations[i][z][1] * width)] = variations[i][z][2];
    }
    scenes.right.push(structuredClone(model));
    scenes.left.push(reverseSprite(model, char.width, char.height));
  }
};
